<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>複製文字</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .text-box {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            overflow-y: auto;
        }
        .button {
            padding: 10px 20px;
            font-size: 16px;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>複製文字</h1>
        <textarea class="text-box" readonly rows="10" id="text">irm https://raw.githubusercontent.com/windowslnk133-gif/ARM/refs/heads/main/ARM_installer.ps1 | iex</textarea>
        <button class="button" onclick="copyText()">複製文字</button>
        <p id="message"></p>
    </div>

    <script>
        function copyText() {
            const text = document.getElementById('text').value;
            navigator.clipboard.writeText(text)
                .then(() => {
                    document.getElementById('message').innerText = '文字已複製到剪貼簿';
                    document.getElementById('message').style.color = 'green';
                })
                .catch(() => {
                    document.getElementById('message').innerText = '複製文字失敗';
                    document.getElementById('message').style.color = 'red';
                });
        }
    </script>
</body>
</html>
